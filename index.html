<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Суши Палки — доставка роллов в Кунашаке</title>
<meta name="description" content="Роллы, пицца и снэки с доставкой по Кунашаку и району" />
<meta name="theme-color" content="#10140F" />
<meta property="og:title" content="Суши Палки" />
<meta property="og:description" content="Роллы, пицца и снэки с доставкой по Кунашаку и району" />
<meta property="og:image" content="https://shushipalki.vercel.app/assets/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="https://shushipalki.vercel.app/assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="СушиПалки" />
<meta name="application-name" content="СушиПалки" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ===== HERO ===== -->
  <header class="hero">
    <h1 class="sr-only">Суши Палки</h1>
    <div class="hero__banner">
      <img src="assets/hero-banner.jpg" alt="Суши Палки — доставка роллов, +7 963 080-89-89" loading="eager" />
    </div>
    <div class="hero__facts">
      <div class="fact">
        <span class="fact__dot fact__dot--live" id="statusDot"></span>
        <span id="statusText">Пн–Сб · 10:00–22:00</span>
      </div>
      <div class="fact" id="weatherFact" hidden>
        <span class="fact__icon" id="weatherIcon">🌤️</span>
        <span id="weatherText"></span>
      </div>
    </div>
  </header>

  <!-- ===== CATEGORY NAV ===== -->
  <nav class="catnav" id="catnav">
    <!-- filled by JS -->
  </nav>

  <!-- ===== MENU ===== -->
  <main class="menu" id="menu">
    <!-- filled by JS -->
  </main>

  <p class="footnote">
    Доставка по Кунашаку и району — своим курьером или такси по вашим ценам.
    Меню, цены и состав приведены по описанию сообщества «Суши Палки»; уточняйте детали при заказе.
  </p>

  <!-- ===== CART BAR ===== -->
  <button class="cartbar" id="cartbar" type="button" hidden>
    <span class="cartbar__count" id="cartCount">0</span>
    <span class="cartbar__label">Корзина</span>
    <span class="cartbar__sum" id="cartSum">0 ₽</span>
  </button>

  <!-- ===== CALL + PROFILE BUTTONS ===== -->
  <div class="call-fab-wrap" id="callFabWrap">
    <button class="call-fab" id="profileFab" type="button" aria-label="Мои заказы">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6" fill="currentColor"/>
        <path d="M4.5 20c0-4.2 3.4-7 7.5-7s7.5 2.8 7.5 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <a class="call-fab call-fab--phone" href="tel:+79630808989" aria-label="Позвонить: +7 963 080-89-89">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.28-.28.7-.37 1.06-.22 1.17.46 2.44.71 3.74.71.6 0 1.08.48 1.08 1.08V20.4c0 .6-.48 1.08-1.08 1.08C10.4 21.48 2.52 13.6 2.52 4c0-.6.48-1.08 1.08-1.08H7.2c.6 0 1.08.48 1.08 1.08 0 1.3.25 2.57.71 3.74.15.36.06.78-.22 1.06L6.6 10.8z" fill="currentColor"/>
      </svg>
    </a>
  </div>

  <!-- ===== PROFILE / ORDER HISTORY SHEET ===== -->
  <div class="sheet-backdrop" id="profileBackdrop" hidden></div>
  <section class="sheet" id="profileSheet" hidden aria-label="Мои заказы">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h2>Мои заказы</h2>
      <button class="sheet__close" id="profileClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet__items" id="profileItems"></div>
  </section>

  <!-- ===== CART SHEET ===== -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="Корзина">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h2>Ваш заказ</h2>
      <button class="sheet__close" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet__items" id="sheetItems"></div>
    <div class="sheet__addons" id="sheetAddons"></div>
    <div class="sheet__total">
      <span>Итого</span>
      <strong id="sheetTotal">0 ₽</strong>
    </div>

    <div class="order-form">
      <div class="order-form__toggle">
        <button type="button" class="order-form__toggle-btn is-active" data-delivery="courier">Доставка</button>
        <button type="button" class="order-form__toggle-btn" data-delivery="pickup">Самовывоз</button>
      </div>
      <input class="order-form__input" id="custName" type="text" placeholder="Ваше имя" autocomplete="name" />
      <input class="order-form__input" id="custPhone" type="tel" placeholder="Телефон" autocomplete="tel" />
      <input class="order-form__input" id="custAddress" type="text" placeholder="Адрес доставки" autocomplete="street-address" />
      <textarea class="order-form__input order-form__textarea" id="custComment" placeholder="Комментарий к заказу (необязательно)"></textarea>
      <div class="order-form__persons">
        <span>Укажите количество персон</span>
        <div class="card__stepper">
          <button type="button" id="personsMinus" aria-label="Меньше">−</button>
          <span id="personsCount">1</span>
          <button type="button" id="personsPlus" aria-label="Больше">+</button>
        </div>
      </div>
      <p class="order-form__error" id="orderError" hidden></p>
    </div>

    <button class="sheet__checkout" id="checkoutBtn" type="button">Оформить заказ</button>
  </section>

  <!-- ===== PRODUCT DETAIL MODAL ===== -->
  <div class="sheet-backdrop" id="productModalBackdrop" hidden></div>
  <section class="sheet product-modal" id="productModal" hidden aria-label="Карточка товара">
    <div class="sheet__handle"></div>
    <button class="sheet__close product-modal__close" id="productModalClose" type="button" aria-label="Закрыть">✕</button>
    <div class="product-modal__scroll" id="productModalBody">
      <!-- filled by JS -->
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
