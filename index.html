<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Вкусно едем — доставка в Кунашаке</title>
<meta name="description" content="Пицца, суши, шаурма и бургеры с доставкой по Кунашаку и району" />
<meta name="theme-color" content="#2E1F1B" />
<meta property="og:title" content="Вкусно едем" />
<meta property="og:description" content="Пицца, суши, шаурма и бургеры с доставкой по Кунашаку и району" />
<meta property="og:image" content="https://vkusnoedem.vercel.app/assets/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="https://vkusnoedem.vercel.app/assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ===== HERO ===== -->
  <header class="hero">
    <h1 class="sr-only">Вкусно едем</h1>
    <div class="hero__banner">
      <img src="assets/hero-banner.jpg" alt="Вкусно едем — принимаем заказы с 10:00, +7 951 111 0700, с. Кунашак, ул. 8 Марта 2Б/2" loading="eager" />
    </div>
    <div class="hero__facts">
      <div class="fact">
        <span class="fact__dot fact__dot--live" id="statusDot"></span>
        <span id="statusText">Пн–Сб · 10:00–22:00</span>
      </div>
      <div class="fact">
        <span class="fact__icon">★</span>
        <span>Военным — скидка 10% по удостоверению</span>
      </div>
      <div class="fact" id="weatherFact" hidden>
        <span class="fact__icon" id="weatherIcon">🌤️</span>
        <span id="weatherText"></span>
      </div>
    </div>
  </header>

  <!-- ===== CATEGORY NAV ===== -->
  <nav class="catnav" id="catnav">
    <!-- filled by JS -->
  </nav>

  <!-- ===== MENU ===== -->
  <main class="menu" id="menu">
    <!-- filled by JS -->
  </main>

  <p class="footnote">
    Доставка по Кунашаку и району — своим курьером или такси по вашим ценам.
    Меню, цены и состав приведены по описанию сообщества; уточняйте детали при заказе.
  </p>

  <!-- ===== CART BAR ===== -->
  <button class="cartbar" id="cartbar" type="button" hidden>
    <span class="cartbar__count" id="cartCount">0</span>
    <span class="cartbar__label">Корзина</span>
    <span class="cartbar__sum" id="cartSum">0 ₽</span>
  </button>

  <!-- ===== CART SHEET ===== -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="Корзина">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h2>Ваш заказ</h2>
      <button class="sheet__close" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet__items" id="sheetItems"></div>
    <div class="sheet__total">
      <span>Итого</span>
      <strong id="sheetTotal">0 ₽</strong>
    </div>

    <div class="order-form">
      <div class="order-form__toggle">
        <button type="button" class="order-form__toggle-btn is-active" data-delivery="courier">Доставка</button>
        <button type="button" class="order-form__toggle-btn" data-delivery="pickup">Самовывоз</button>
      </div>
      <input class="order-form__input" id="custName" type="text" placeholder="Ваше имя" autocomplete="name" />
      <input class="order-form__input" id="custPhone" type="tel" placeholder="Телефон" autocomplete="tel" />
      <input class="order-form__input" id="custAddress" type="text" placeholder="Адрес доставки" autocomplete="street-address" />
      <textarea class="order-form__input order-form__textarea" id="custComment" placeholder="Комментарий к заказу (необязательно)"></textarea>
      <p class="order-form__error" id="orderError" hidden></p>
    </div>

    <button class="sheet__checkout" id="checkoutBtn" type="button">Оформить заказ</button>
  </section>

  <!-- ===== PRODUCT DETAIL MODAL ===== -->
  <div class="sheet-backdrop" id="productModalBackdrop" hidden></div>
  <section class="sheet product-modal" id="productModal" hidden aria-label="Карточка товара">
    <div class="sheet__handle"></div>
    <button class="sheet__close product-modal__close" id="productModalClose" type="button" aria-label="Закрыть">✕</button>
    <div class="product-modal__scroll" id="productModalBody">
      <!-- filled by JS -->
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
